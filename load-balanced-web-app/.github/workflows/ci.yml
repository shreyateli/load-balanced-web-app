# .github/workflows/ci.yml
# This file tells GitHub: "every time code is pushed, automatically
# run our tests. If any test fails, block the code from going through."
# This is the CI/CD (Continuous Integration / Continuous Deployment)
# part required by the assignment.

name: CI - Run Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Get the code from the repository
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Set up Node.js (needed to run our app/tests)
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Step 3: Install the project's dependencies (Express, Jest, etc.)
      - name: Install dependencies
        run: npm install

      # Step 4: Run the 4 test cases. If ANY test fails,
      # this step fails — and GitHub blocks the push automatically.
      - name: Run tests
        run: npm test
